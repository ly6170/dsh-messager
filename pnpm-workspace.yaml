# pnpm 供应链冷却期（minimumReleaseAge，v11 起默认 1440 分钟）白名单。
#
# @deepseek-ai/* 是 DSH 本体与其**同批次发布**的配套包（cordis / schemastery /
# cosmokit / dsh-* …）。本插件必须能立刻跟上 DSH 版本，否则无法在同一批次里
# 完成升级验证，因此整个供应商 scope 豁免冷却期（pnpm 官方支持的 scope 通配形式）。
#
# ⚠️ 不要改回逐条 `name@version` 列举：DSH 每次发版都会新增/提升一批包，
# 漏掉任意一条就会让 `pnpm install` 直接失败：
#   [ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION] N lockfile entries failed verification
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
